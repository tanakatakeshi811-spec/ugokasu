<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ウゴカス</title>
<meta name="description" content="2Dで描いて、3Dで見る。アニメ工房">
<meta name="theme-color" content="#2f66e0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* 配置: 上に道具バー、左に道具、まん中に画面、右に設定、下にタイムシート(タイムライン) */
:root {
  --bg: #e9edf3;        /* 作業机 */
  --panel: #ffffff;     /* 作画用紙 */
  --panel2: #f4f6fa;
  --ink: #1f2433;       /* 鉛筆の黒 */
  --mute: #697186;
  --line: #d6dce6;
  --accent: #2f66e0;    /* 青鉛筆(選択) */
  --accent-ink: #ffffff;
  --rec: #e5484d;       /* 赤鉛筆(再生位置・自動キー) */
  --ok: #2f9e64;
  --warn: #c27a00;
  --key: #262c3d;
  --cel: #8fb2f2;
  --cel-edge: #5a83d6;
  --hold: #cddcf7;
  --tl-bg: #fbfcfe;
  --tl-alt: #f2f5fa;
  --tl-sec: #c3cbd8;
  --tl-out: #e6e9ef;
  --sel-row: rgba(47, 102, 224, 0.08);
  --shadow: 0 10px 30px rgba(20, 28, 45, 0.16);
  --f-ui: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', system-ui, sans-serif;
  --f-logo: 'Dela Gothic One', 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  --f-num: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --panel: #191d27; --panel2: #1f2430; --ink: #e7eaf1; --mute: #8f97aa; --line: #2b3242;
    --accent: #6d98ff; --accent-ink: #0d1220; --rec: #ff666b; --ok: #4cc38a; --warn: #f0b13e; --key: #e7eaf1;
    --cel: #4466a8; --cel-edge: #7a9be0; --hold: #26344f; --tl-bg: #161a23; --tl-alt: #1b202b; --tl-sec: #3a4356; --tl-out: #0f1218;
    --sel-row: rgba(109, 152, 255, 0.1); --shadow: 0 12px 34px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --panel: #191d27; --panel2: #1f2430; --ink: #e7eaf1; --mute: #8f97aa; --line: #2b3242;
  --accent: #6d98ff; --accent-ink: #0d1220; --rec: #ff666b; --ok: #4cc38a; --warn: #f0b13e; --key: #e7eaf1;
  --cel: #4466a8; --cel-edge: #7a9be0; --hold: #26344f; --tl-bg: #161a23; --tl-alt: #1b202b; --tl-sec: #3a4356; --tl-out: #0f1218;
  --sel-row: rgba(109, 152, 255, 0.1); --shadow: 0 12px 34px rgba(0, 0, 0, 0.5); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; flex: none; display: block; }
.mute { color: var(--mute); }
.small { font-size: 12px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
kbd { font-family: var(--f-num); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel2); }

/* ---------- 共通の部品 ---------- */
.ib { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; }
.ib:hover:not(:disabled) { background: var(--panel2); }
.ib.sm { width: 28px; height: 28px; border-radius: 6px; }
.ib.sm .ico { width: 17px; height: 17px; }
.ib.danger { color: var(--rec); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.sm .ico { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 700; }
.btn.on, .tg.on { border-color: var(--accent); color: var(--accent); }
.tg { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; white-space: nowrap; }
.tg .ico { width: 15px; height: 15px; }
.tg.sm { height: 28px; }
.tg.rec.on { border-color: var(--rec); color: var(--rec); background: color-mix(in srgb, var(--rec) 10%, var(--panel)); }
.ib.tg { border-radius: 8px; padding: 0; width: 34px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; }
.seg button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 7px; font-weight: 700; white-space: nowrap; }
.seg button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.sm button { height: 26px; padding: 0 9px; font-size: 12.5px; font-weight: 500; }
.seg.sm .ico { width: 15px; height: 15px; }
input[type="number"], input:not([type]), select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; min-width: 0; }
select.sm { height: 28px; padding: 0 6px; font-size: 12.5px; }
input[type="range"] { accent-color: var(--accent); min-width: 60px; }
.swatch { display: inline-block; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; flex: none; position: relative; overflow: hidden; }
.swatch.sm { width: 20px; height: 20px; }
.swatch.on { box-shadow: 0 0 0 2px var(--accent); }
.swatch.cur { width: 30px; height: 30px; cursor: pointer; box-shadow: 0 0 0 1px var(--line), inset 0 0 0 1px rgba(0,0,0,.08); }
.swatch input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--mute); padding: 2px 10px 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
.badge .ico { width: 15px; height: 15px; }

/* ---------- ホーム ---------- */
#home { position: fixed; inset: 0; overflow-y: auto; padding: calc(28px + var(--sat)) max(16px, var(--sal)) calc(40px + var(--sab)) max(16px, var(--sar)); }
.home-in { max-width: 1080px; margin: 0 auto; display: grid; gap: 28px; }
.home-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.logo { font-family: var(--f-logo); font-size: clamp(40px, 7vw, 64px); line-height: 1; letter-spacing: 0.02em; display: flex; align-items: flex-end; gap: 0.08em; }
.logo span { display: inline-block; animation: hop 2.4s ease-in-out infinite; }
.logo span:nth-child(2) { animation-delay: .12s; } .logo span:nth-child(3) { animation-delay: .24s; } .logo span:nth-child(4) { animation-delay: .36s; }
.logo span:nth-child(4) { color: var(--rec); }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .logo span { animation: none; } }
.home-sub { color: var(--mute); margin-top: 8px; font-size: 15px; }
.home-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0; font-size: 18px; }
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.tpl { display: grid; grid-template-rows: auto auto 1fr; gap: 4px; text-align: left; padding: 0 0 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; transition: transform .15s, border-color .15s; }
.tpl:hover { transform: translateY(-2px); border-color: var(--accent); }
.tpl b { padding: 0 14px; font-size: 15px; }
.tpl small { padding: 0 14px; color: var(--mute); font-size: 12px; line-height: 1.45; }
.tpl .art { position: relative; height: 96px; margin-bottom: 8px; background: var(--panel2); border-bottom: 1px solid var(--line); overflow: hidden; }
.tpl .art .ic { position: absolute; right: 12px; bottom: 10px; color: var(--accent); }
.tpl .art .ic .ico { width: 26px; height: 26px; }
.tpl .art i { position: absolute; display: block; }
.tpl.flip .art i { width: 54px; height: 64px; left: 22px; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
.tpl.flip .art i:nth-child(2) { left: 36px; top: 20px; transform: rotate(5deg); }
.tpl.flip .art i:nth-child(3) { left: 50px; top: 24px; transform: rotate(10deg); background: linear-gradient(var(--panel), var(--panel)) padding-box; box-shadow: inset 0 -14px 0 -10px var(--rec); }
.tpl.move .art i { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); top: 36px; left: 30px; opacity: .2; }
.tpl.move .art i:nth-child(2) { left: 60px; opacity: .45; } .tpl.move .art i:nth-child(3) { left: 90px; opacity: 1; }
.tpl.dio .art i { width: 70px; height: 50px; top: 24px; left: 24px; border-radius: 4px; background: #9cc3a4; transform: skewY(-12deg); opacity: .6; }
.tpl.dio .art i:nth-child(2) { left: 46px; top: 30px; background: #f2c94c; opacity: .8; }
.tpl.dio .art i:nth-child(3) { left: 68px; top: 36px; background: var(--rec); opacity: .85; }
.tpl.cube .art i { width: 40px; height: 40px; left: 30px; top: 28px; background: var(--accent); transform: rotate(45deg) skew(-8deg, -8deg); border-radius: 4px; }
.tpl.cube .art i:nth-child(2) { width: 24px; height: 24px; border-radius: 50%; left: 92px; top: 46px; background: var(--rec); transform: none; }
.tpl.cube .art i:nth-child(3) { width: 140px; height: 10px; left: 14px; top: 76px; background: var(--line); transform: none; border-radius: 50%; }
.tpl.fig .art i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); left: 54px; top: 14px; }
.tpl.fig .art i:nth-child(2) { width: 4px; height: 34px; border: 0; border-radius: 2px; background: var(--ink); left: 61px; top: 34px; }
.tpl.fig .art i:nth-child(3) { width: 46px; height: 4px; border: 0; border-radius: 2px; background: var(--rec); left: 40px; top: 44px; transform: rotate(-20deg); }
.tpl.sample .art i { width: 22px; height: 22px; border-radius: 50%; background: var(--rec); left: 26px; top: 20px; animation: bounce 1.2s cubic-bezier(.4,0,.6,1) infinite alternate; }
.tpl.sample .art i:nth-child(2) { width: 160px; height: 22px; border-radius: 0; background: #7fb069; left: 0; top: 74px; animation: none; }
.tpl.sample .art i:nth-child(3) { display: none; }
@keyframes bounce { from { transform: translate(0, 0); } to { transform: translate(40px, 30px) scale(1.15, .85); } }
@media (prefers-reduced-motion: reduce) { .tpl.sample .art i { animation: none; } }
.projs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.proj { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pthumb { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; background: var(--panel2); }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb .noimg { display: grid; place-items: center; height: 100%; color: var(--mute); }
.pmeta { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 4px; padding: 8px 6px 10px 12px; align-items: center; }
.pmeta b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmeta small { grid-row: 2; color: var(--mute); font-size: 12px; }
.pmeta .ib { grid-row: 1 / span 2; grid-column: 2; }
.empty { grid-column: 1 / -1; display: grid; gap: 4px; padding: 28px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; color: var(--mute); }
.empty b { color: var(--ink); }

/* ---------- 編集画面 ---------- */
#editor { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
#topbar { display: flex; align-items: center; gap: 6px; padding: calc(6px + var(--sat)) max(10px, var(--sar)) 6px max(8px, var(--sal)); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
#p-name { width: min(240px, 30vw); font-weight: 700; border-color: transparent; background: transparent; height: 34px; font-size: 15px; }
#p-name:hover, #p-name:focus { border-color: var(--line); background: var(--panel); }
#save-state { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--mute); white-space: nowrap; }
#save-state .ico { width: 16px; height: 16px; }
#save-state[data-s="saving"] { color: var(--accent); }
#save-state[data-s="error"] { color: var(--rec); font-weight: 700; }
#topbar .sp { flex: 1; }
#b-export { margin-left: 4px; }
#b-panel { display: none; }
#main { display: grid; grid-template-columns: 68px minmax(0, 1fr) 300px; min-height: 0; }
#tools { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; padding-left: max(6px, var(--sal)); }
.tool { display: grid; justify-items: center; gap: 1px; width: 54px; padding: 6px 0 4px; border: 0; border-radius: 10px; background: transparent; }
.tool small { font-size: 10.5px; line-height: 1.2; color: var(--mute); white-space: nowrap; }
.tool:hover:not(:disabled) { background: var(--panel2); }
.tool.on { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); color: var(--accent); }
.tool.on small { color: var(--accent); font-weight: 700; }
.tool.add { color: var(--accent); }
.tsep { width: 32px; height: 1px; background: var(--line); margin: 4px 0; flex: none; }
#stage-wrap { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#toolopts { display: flex; align-items: center; gap: 14px; min-height: 46px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.opt { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.opt .num { min-width: 2.4em; color: var(--mute); font-size: 12px; }
.opt.colors, .colors { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--mute); white-space: nowrap; }
#viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; background: var(--bg); }
#viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#viewport canvas.ov { pointer-events: none; }
#viewport[data-tool="pen"], #viewport[data-tool="eraser"], #viewport[data-tool="shape"] { cursor: crosshair; }
#viewport[data-tool="fill"] { cursor: cell; }
#viewport[data-tool="text"] { cursor: text; }
#viewport[data-tool="view"] { cursor: grab; }
#viewport.drop::after { content: 'ここに3Dモデルや画像をドロップ'; position: absolute; inset: 12px; display: grid; place-items: center; border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 700; color: var(--accent); }
#vp-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; padding: 3px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; }
#vp-badge { position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); pointer-events: none; }
#viewport[data-view="cam"] #vp-badge { color: var(--rec); border-color: var(--rec); }
#boot-fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 95; background: var(--bg); }
#vp-empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 16px; }
.ecard { pointer-events: auto; display: grid; justify-items: center; gap: 8px; max-width: 360px; padding: 22px 22px 18px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.ecard .big { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); }
.ecard .big .ico { width: 28px; height: 28px; }
.ecard small { color: var(--mute); line-height: 1.6; }
.ecard .btn { margin-top: 4px; }
#txt-in { position: absolute; z-index: 5; min-width: 180px; transform: translate(-4px, -50%); font-size: 18px; font-weight: 700; border: 2px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 6px 10px; resize: none; }
#panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; min-height: 0; padding-right: var(--sar); }
.phd { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.pic { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--panel2); color: var(--accent); flex: none; }
.pnm { display: grid; min-width: 0; flex: 1; }
.pnm small { color: var(--mute); font-size: 11.5px; }
.pname { font-weight: 700; border-color: transparent; background: transparent; padding: 2px 4px; margin-left: -4px; width: 100%; }
.pname:hover, .pname:focus { border-color: var(--line); background: var(--panel); }
.psec { display: grid; gap: 8px; padding: 12px 14px 14px; border-bottom: 1px solid var(--line); }
.psec h4 { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--mute); }
.prow { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; }
.prow.tog { grid-template-columns: 1fr auto; }
.prow.tog small { grid-column: 1 / -1; margin-top: -4px; line-height: 1.45; }
.plab { color: var(--mute); font-size: 12.5px; }
.pvals { display: flex; gap: 4px; min-width: 0; }
.vec .pvals .nf { flex: 1 1 0; }
.nf { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); overflow: hidden; min-width: 0; flex: 1; }
.nf .scrub { flex: none; padding: 0 5px; font-size: 11px; font-weight: 700; color: var(--mute); cursor: ew-resize; user-select: none; touch-action: none; align-self: stretch; display: grid; place-items: center; background: var(--panel2); }
.nf:nth-child(1) .scrub { color: #e5484d; } .vec .nf:nth-child(2) .scrub { color: #2f9e64; } .vec .nf:nth-child(3) .scrub { color: #2f66e0; }
.nf input { border: 0; border-radius: 0; width: 0; min-width: 0; flex: 1 1 auto; padding: 4px 4px; font-family: var(--f-num); font-size: 12px; background: transparent; -moz-appearance: textfield; }
.nf input::-webkit-inner-spin-button { display: none; }
.nf i { font-style: normal; color: var(--mute); font-size: 11px; padding-right: 4px; }
.sl { display: flex; align-items: center; gap: 8px; width: 100%; }
.sl input { flex: 1; }
.sl .num { font-size: 12px; color: var(--mute); min-width: 3em; text-align: right; }
.keyrow { display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 9px; background: var(--panel2); min-height: 40px; }
.keyrow .kon { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; font-size: 12.5px; flex: 1; min-width: 0; white-space: nowrap; }
.keyrow .kon .ico { width: 15px; height: 15px; }
.keyrow .koff { flex: 1; }
.keyrow select { max-width: 7.5em; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.switch { position: relative; width: 42px; height: 24px; border-radius: 999px; border: 0; background: var(--line); padding: 0; transition: background .15s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch.on { background: var(--accent); }
.switch.on i { transform: translateX(18px); }
.ptext { width: 100%; resize: vertical; }
.bones { display: flex; flex-wrap: wrap; gap: 4px; max-height: 210px; overflow-y: auto; }
.bone { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12.5px; }
.bone .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.bone .dot.k { background: #f5a524; }

    const wait = Date.now() - this.firstDirty > 9e3 ? 50 : 1600;
    this.saveT = setTimeout(() => this.saveNow(), wait);
  },
  async saveNow() {
    clearTimeout(this.saveT);
    const p = S.proj;
    if (!p || this.ver === this.savedVer) return;
    if (V.exporting) {
      this.saveT = setTimeout(() => this.saveNow(), 2e3);
      return;
    }
    if (this.saving) {
      this.again = true;
      return this.saving;
    }
    const ver = this.ver;
    this.firstDirty = 0;
    S.saveState = "saving";
    UI.saveState();
    this.saving = (async () => {
      try {
        p.updated = Date.now();
        p.view = S.view;
        p.tool = S.tool;
        p.sel = S.sel;
        const thumb = S.playing ? this.lastThumb || "" : V.thumb();
        this.lastThumb = thumb;
        await Store.save(p, serialize(p), thumb);
        this.savedVer = Math.max(this.savedVer, ver);
        S.saveState = this.ver === this.savedVer ? "saved" : "dirty";
      } catch (e) {
        S.saveState = "error";
        UI.toast("保存できませんでした: " + (e && (e.message || e.code) || e), "error");
      } finally {
        UI.saveState();
        const again = this.again;
        this.again = false;
        this.saving = null;
        if ((again || this.ver !== this.savedVer) && S.saveState !== "error" && S.proj === p) this.dirty();
      }
    })();
    return this.saving;
  },
  // 何か変わった時に呼ぶ
  changed() {
    if (!S.proj) return;
    S.proj.updated = Date.now();
    V.sync();
    TL.draw();
    Panel.refreshValues();
    UI.emptyState();
    this.dirty();
  },
  // ---------- 選ぶ・コマ ----------
  select(id, keepFrame) {
    if (S.sel === id) return;
    S.sel = id;
    S.bone = null;
    const o = selObj();
    if (S.pose && (!o || o.type !== "model")) S.pose = false;
    if (!keepFrame) S.selKey = null;
    V.sync();
    TL.buildList();
    Panel.render();
    UI.refreshTools();
  },
  setFrame(f) {
    const p = S.proj;
    if (!p) return;
    f = clamp(Math.round(f), 0, p.length - 1);
    if (f === S.frame) {
      TL.draw();
      return;
    }
    S.frame = f;
    V.sync();
    TL.ensureVisible();
    TL.draw();
    Panel.refreshValues();
    UI.frameLabel();
  },
  step(d) {
    if (S.playing) this.stop();
    const p = S.proj;
    let f = S.frame + d;
    if (S.loop) f = (f + p.length) % p.length;
    this.setFrame(f);
  },
  // ---------- 再生 ----------
  play() {
    const p = S.proj;
    if (!p || S.playing) return;
    S.playing = true;
    this.playT = performance.now();
    this.acc = 0;
    if (S.frame >= p.length - 1) S.frame = 0;
    V.sync(true);
    V.updateGizmo();
    UI.refreshPlay();
    TL.draw();
  },
  stop() {
    if (!S.playing) return;
    S.playing = false;
    V.sync(true);
    V.updateGizmo();
    UI.refreshPlay();
    Panel.refreshValues();
    TL.draw();
  },
  togglePlay() {
    S.playing ? this.stop() : this.play();
  },
  tick(now) {
    if (!S.playing || !S.proj) return;
    const p = S.proj, step = 1 / p.fps;
    this.acc += Math.min(0.25, (now - this.playT) / 1e3);
    this.playT = now;
    let moved = false;
    while (this.acc >= step) {
      this.acc -= step;
      let f = S.frame + 1;
      if (f >= p.length) {
        if (S.loop) f = 0;
        else {
          this.stop();
          return;
        }
      }
      S.frame = f;
      moved = true;
    }
    if (moved) {
      V.sync();
      TL.ensureVisible();
      TL.draw();
      UI.frameLabel();
    }
  },
  // ---------- 物を足す・消す ----------
  addObj(type, extra = {}) {
    const p = S.proj;
    if (!p) return null;
    const o = makeObj(type, p, extra);
    if (type === "draw" && !extra.base) {
      const zs = p.objs.filter((x) => x.type === "draw").map((x) => evalTf(x, S.frame).p[2]);
      o.base.p[2] = zs.length ? round(Math.max(...zs) + 0.05, 3) : 0;
    }
    if (S.view === "3d" && (SOLIDS.includes(type) || type === "model") && !extra.base) {
      const t = V.orbit.target;
      o.base.p[0] = round(t.x, 2);
      o.base.p[2] = round(t.z, 2);
    }
    const at = p.objs.length;
    p.objs.push(o);
    History.push({ label: "追加", undo: () => {
      const i = p.objs.indexOf(o);
      if (i >= 0) p.objs.splice(i, 1);
      if (S.sel === o.id) S.sel = null;
      TL.buildList();
      Panel.render();
    }, redo: () => {
      p.objs.splice(at, 0, o);
      TL.buildList();
    } });
    S.sel = null;
    this.select(o.id);
    this.changed();
    return o;
  },
  pickFile(kind) {
    const el = $(kind === "model" ? "#file-model" : kind === "image" ? "#file-image" : "#file-proj");
    el.value = "";
    el.click();
  },
  async addFile(file, kind) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, "").slice(0, 30) || "ファイル";
    if (kind === "model") {
      if (!MODEL_EXTS.includes(ext)) {
        UI.toast("3Dモデルは GLB / VRM / FBX / OBJ / STL が使えるよ", "warn");
        return;
      }
      if (file.size > 80 * 1024 * 1024) {
        UI.toast("80MBより大きいモデルは読めないよ", "warn");
        return;
      }
      UI.busy(true, "3Dモデルを保存しています…");
      try {
        Store.note = "";
        const ref = await Store.putAsset(await file.arrayBuffer(), { name: file.name, ext, mime: "" });
        if (Store.note === "big") UI.toast("大きなファイルなので、このブラウザの中にだけ保存したよ", "warn");
        this.addObj("model", { name, asset: ref });
        if (S.view === "2d") UI.toast("3Dモデルを置いたよ。上の「3D」で回りこんで見られるよ");
      } catch (e) {
        UI.toast("読みこめませんでした: " + e.message, "error");
      } finally {
        UI.busy(false);
      }
      return;
    }
    if (kind === "image") {
      const mime = /^image\/(png|jpeg|gif|webp)$/.test(file.type) ? file.type : { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" }[ext];
      if (!mime) {
        UI.toast("画像は PNG / JPEG / GIF / WebP が使えるよ", "warn");
        return;
      }
      UI.busy(true, "画像を保存しています…");
      try {
        const buf = await file.arrayBuffer();
        let aspect = 1;
        try {
          const bm = await createImageBitmap(new Blob([buf], { type: mime }));
          aspect = bm.width / bm.height;
          bm.close && bm.close();
        } catch (e) {
        }
        const ref = await Store.putAsset(buf, { name: file.name, ext, mime });
        this.addObj("image", { name, asset: ref, aspect, base: { p: [0, 4.5, 0.1], r: [0, 0, 0], s: [1, 1, 1], o: 1 } });
      } catch (e) {
        UI.toast("読みこめませんでした: " + e.message, "error");
      } finally {
        UI.busy(false);
      }
    }
  },
  del(id = S.sel) {
    const p = S.proj;
    if (!p || !id || id === "cam") return;
    const i = p.objs.findIndex((o2) => o2.id === id);
    if (i < 0) return;
    const o = p.objs[i];
    p.objs.splice(i, 1);
    History.push({ label: "削除", undo: () => {
      p.objs.splice(i, 0, o);
      TL.buildList();
    }, redo: () => {
      const j = p.objs.indexOf(o);
      if (j >= 0) p.objs.splice(j, 1);
      if (S.sel === o.id) S.sel = null;
      TL.buildList();
      Panel.render();
    } });
    S.sel = null;
    S.pose = false;
    S.bone = null;
    TL.buildList();
    Panel.render();
    UI.refreshTools();
    this.changed();
    UI.toast(`「${o.name}」を消したよ`, "", { label: "元に戻す", fn: () => History.undo() });
  },
  dup(id = S.sel) {
    const p = S.proj;
    if (!p || !id || id === "cam") return;
    const i = p.objs.findIndex((o2) => o2.id === id);
    if (i < 0) return;
    const src = p.objs[i];
    const o = JSON.parse(serialize(src));
    o.id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    o.name = src.name + "のコピー";
    const sh = src.type === "draw" ? 0.05 : 0.6;
    for (const t of [o.base, ...o.keys]) {
      t.p[0] = round(t.p[0] + sh, 3);
      if (src.type === "draw") t.p[2] = round(t.p[2] + 0.05, 3);
    }
    if (o.cels) for (const c of o.cels) c._v = 0;
    p.objs.splice(i + 1, 0, o);
    History.push({ label: "複製", undo: () => {
      const j = p.objs.indexOf(o);
      if (j >= 0) p.objs.splice(j, 1);
      if (S.sel === o.id) S.sel = null;
      TL.buildList();
      Panel.render();
    }, redo: () => {
      p.objs.splice(i + 1, 0, o);
      TL.buildList();
    } });
    S.sel = null;
    this.select(o.id);
    this.changed();
  },
  reorder(id, to) {
    const p = S.proj, i = p.objs.findIndex((o2) => o2.id === id);
    if (i < 0) return;
    to = clamp(to, 0, p.objs.length - 1);
    if (to === i) return;
    const o = p.objs[i];
    const mv = (a, b) => {
      p.objs.splice(a, 1);
      p.objs.splice(b, 0, o);
      TL.buildList();
    };
    mv(i, to);
    History.push({ label: "並べかえ", undo: () => mv(p.objs.indexOf(o), i), redo: () => mv(p.objs.indexOf(o), to) });
    this.changed();
  },
  toggle(id, key) {
    const o = id === "cam" ? S.proj.cam : S.proj.objs.find((x) => x.id === id);
    if (!o) return;
    trackObj(key === "hidden" ? "表示" : "ロック", o, () => {
      o[key] = !o[key];
    });
    TL.buildList();
    this.changed();
  },
  setProp(o, key, val, label = "変更") {
    if (!o) return;
    trackObj(label, o, () => {
      o[key] = val;
    });
    this.changed();
  },
  setProj(key, val) {
    const p = S.proj, before = p[key];
    if (before === val) return;
    const apply = (v) => {
      p[key] = v;
      if (key === "w" || key === "h" || key === "aspect") V.setProject(p);
      if (key === "length") {
        S.frame = Math.min(S.frame, p.length - 1);
        TL.fit(true);
      }
      TL.draw();
      Panel.render();
      UI.refreshAll();
    };
    apply(val);
    History.push({ label: "設定", undo: () => apply(before), redo: () => apply(val) });
    this.changed();
  },
  setAspect(key) {
    const p = S.proj, [w, h2] = ASPECTS[key] || ASPECTS["16:9"];
    if (p.w === w && p.h === h2) return;
    const before = [p.w, p.h];
    const apply = ([a, b]) => {
      p.w = a;
      p.h = b;
      V.setProject(p);
      V.fit2d();
      Panel.render();
      TL.draw();
    };
    apply([w, h2]);
    History.push({ label: "画面の形", undo: () => apply(before), redo: () => apply([w, h2]) });
    this.changed();
  },
  // ---------- キー ----------
  addKey() {
    const o = selObj();
    if (!o) {
      UI.toast("先に、動かしたい物を選んでね");
      return;
    }
    trackObj("キー", o, () => {
      const tf = cloneTf(evalTf(o, S.frame));
      const old = keyAt(o, S.frame);
      putKey(o, { f: S.frame, ...tf, e: old ? old.e : "ease" });
    });
    UI.toast("◆ このコマにキーを打ったよ");
    this.changed();
  },
  delKey(k = S.selKey) {
    const p = S.proj;
    if (!k) {
      const o2 = selObj();
      if (o2 && keyAt(o2, S.frame)) k = { kind: "t", id: o2.id, f: S.frame };
      else if (o2 && o2.type === "draw" && o2.cels.some((c) => c.f === S.frame)) k = { kind: "c", id: o2.id, f: S.frame };
    }
    if (!k) {
      UI.toast("このコマにはキーがないよ");
      return;
    }
    const o = k.id === "cam" ? p.cam : p.objs.find((x) => x.id === k.id);
    if (!o) return;
    if (k.kind === "c") {
      this.celDel(o, k.f);
      return;
    }
    trackObj("キーを消す", o, () => {
      const i = o.keys.findIndex((x) => x.f === k.f);
      if (i < 0) return;
      const rem = o.keys.splice(i, 1)[0];
      if (!o.keys.length) o.base = cloneTf(rem);
    });
    S.selKey = null;
    this.changed();
  },
  setEase(k, e) {
    const o = k.id === "cam" ? S.proj.cam : S.proj.objs.find((x) => x.id === k.id);
    if (!o) return;
    trackObj("動き方", o, () => {
      const key = keyAt(o, k.f);
      if (key) key.e = e;
    });
    this.changed();
  },
  moveKey(k, to) {
    const p = S.proj, o = k.id === "cam" ? p.cam : p.objs.find((x) => x.id === k.id);
    if (!o) return;
    if (k.kind === "c") {
      if (o.cels.some((c) => c.f === to)) {
        UI.toast("そのコマにはもう絵があるよ");
        S.selKey = { ...k };
        this.changed();
        return;
      }
      const cel = o.cels.find((c) => c.f === k.f);
      if (!cel) return;
      const mv = (f) => {
        cel.f = f;
        cel._v = (cel._v || 0) + 1;
        o.cels.sort((a, b) => a.f - b.f);
      };
      mv(to);
      History.push({ label: "コマを動かす", undo: () => mv(k.f), redo: () => mv(to) });
    } else {
      if (keyAt(o, to)) {
        UI.toast("そのコマにはもうキーがあるよ");
        S.selKey = { ...k };
        this.changed();
        return;
      }
      trackObj("キーを動かす", o, () => {
        const key = keyAt(o, k.f);
        if (key) {
          key.f = to;
          o.keys.sort((a, b) => a.f - b.f);
        }
      });
    }
    S.selKey = { kind: k.kind, id: k.id, f: to };
    this.changed();
  },
  copyKeyTo(k, f) {
    const o = k.id === "cam" ? S.proj.cam : S.proj.objs.find((x) => x.id === k.id);
    if (!o) return;
    const src = keyAt(o, k.f);
    if (!src) return;
    trackObj("キーを複製", o, () => putKey(o, { ...JSON.parse(JSON.stringify(src)), f }));
    this.changed();
  },
  // ---------- 絵のコマ ----------
  drawObj() {
    const o = selObj();
    if (o && o.type === "draw") return o;
    UI.toast("絵のレイヤーを選んでね");
    return null;
  },
  celNew() {
    const o = this.drawObj();
    if (!o) return;
    const f = S.frame;
    if (o.cels.some((c) => c.f === f)) {
      UI.toast("このコマにはもう紙があるよ。次のコマに進んでから足してね");
      return;
    }
    const cel = { f, ops: [], _v: 1 };
    const add = () => {
      o.cels.push(cel);
      o.cels.sort((a, b) => a.f - b.f);
    };
    add();
    History.push({ label: "コマを足す", undo: () => {
      const i = o.cels.indexOf(cel);
      if (i >= 0) o.cels.splice(i, 1);
    }, redo: add });
    UI.toast("白い紙を足したよ(うすい赤は前のコマ)");
    this.changed();
  },
  celDup() {
    const o = this.drawObj();
    if (!o) return;
    const i = celIndexAt(o, S.frame);
    if (i < 0) {
      UI.toast("ここにはまだ絵がないよ");
      return;
    }
    const src = o.cels[i];
    const f = src.f === S.frame ? S.frame + 1 : S.frame;
    if (f >= S.proj.length) {
      UI.toast("最後のコマだよ。長さを増やしてね");
      return;
    }
    if (o.cels.some((c) => c.f === f)) {
      UI.toast("次のコマにはもう絵があるよ");
      return;
    }
    const cel = { f, ops: [...src.ops], _v: 1 };
    const add = () => {
      o.cels.push(cel);
      o.cels.sort((a, b) => a.f - b.f);
    };
    add();
    History.push({ label: "コマを複製", undo: () => {
      const j = o.cels.indexOf(cel);
      if (j >= 0) o.cels.splice(j, 1);
    }, redo: add });
    this.changed();
    this.setFrame(f);
  },
  celDel(o = this.drawObj(), f = S.frame) {
    if (!o) return;
    const i = o.cels.findIndex((c) => c.f === f);
    if (i < 0) {
      UI.toast("このコマから始まる絵はないよ");
      return;
    }
    const cel = o.cels[i];
    o.cels.splice(i, 1);
    History.push({ label: "コマを消す", undo: () => {
      o.cels.splice(i, 0, cel);
    }, redo: () => {
      const j = o.cels.indexOf(cel);
      if (j >= 0) o.cels.splice(j, 1);
    } });
    S.selKey = null;
    this.changed();
  },
  celClear() {
    const o = this.drawObj();
    if (!o) return;
    const i = celIndexAt(o, S.frame);
    if (i < 0) return;
    const cel = o.cels[i], ops = cel.ops;
    cel.ops = [];
    cel._v++;
    History.push({ label: "絵を消す", undo: () => {
      cel.ops = ops;
      cel._v++;
    }, redo: () => {
      cel.ops = [];
      cel._v++;
    } });
    this.changed();
  },
  // ---------- 道具・見え方 ----------
  setTool(t) {
    if (t === "pose") {
      this.togglePose();
      return;

    S.tool = t;
    if (S.pose && !["select", "view"].includes(t)) {

    V.req();
    UI.refreshTools();
  },
  setView(v) {
    if (S.view === v && !S.camView) return;
    S.view = v;
    S.camView = false;
    V.sync();
    V.updateGizmo();
    V.req();
    UI.refreshTop();
    UI.refreshTools();

  },
  toggleCamView() {
    S.camView = !S.camView;
    V.updateGizmo();
    V.req();
    UI.refreshTop();
  },
  camFromView() {
    const p = S.proj;
    let tf;
    if (S.view === "3d") {
      const c = V.cam3d, e = new THREE3.Euler().setFromQuaternion(c.quaternion, "YXZ");
      const cur = evalTf(p.cam, S.frame);
      tf = { p: c.position.toArray().map((v) => round(v, 3)), r: [e.x, e.y, e.z].map((v) => round(v * 180 / Math.PI, 2)), s: [...cur.s], o: 1 };
      if (p.camType === "ortho") {

    commitTf(p.cam, tf, "カメラ");

  togglePose() {
    const o = selObj();

  selectBone(name) {

  },
  resetBone(name) {

  resetPose() {
    const o = selObj();

      o.bones = {};

  undo() {
    const l = History.undo();
    if (l) UI.toast("元に戻した: " + l);

  },
  redo() {
    const l = History.redo();

};
function afterHistory() {
  if (!S.proj) return;
  if (S.sel && S.sel !== "cam" && !S.proj.objs.some((o) => o.id === S.sel)) S.sel = null;
